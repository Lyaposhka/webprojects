{% extends 'base.html' %}
{% block content %}
<h3>Списание: {{ equipment.name }}</h3>
<form method="post" enctype="multipart/form-data">
    <div class="mb-3">
        <label>Причина:</label>
        <textarea name="reason" class="form-control" required></textarea>
    </div>
    <div class="mb-3">
        <label>PDF акт:</label>
        <input type="file" name="pdf" accept="application/pdf" class="form-control" required>
    </div>
    <button class="btn btn-danger">Списать</button>
</form>
{% endblock %}
