{% extends 'base.html' %}
{% block content %}
<h3>Вход в систему</h3>
<form method="post">
    <div class="mb-3">
        <label>Логин:</label>
        <input type="text" name="login" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Пароль:</label>
        <input type="password" name="password" class="form-control" required>
    </div>
    <button class="btn btn-primary">Войти</button>
</form>
{% endblock %}
